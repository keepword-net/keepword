name: Install

# Only for changes to what the installer and the image build or run.
on:
  pull_request:
    paths:
      - "scripts/**"
      - "packaging/**"
      - "Dockerfile"
      - ".dockerignore"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/keepword.example.toml"
      - ".forgejo/workflows/install.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "packaging/**"
      - "Dockerfile"
      - ".dockerignore"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/keepword.example.toml"
      - ".forgejo/workflows/install.yml"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - run: command -v shellcheck || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
      - run: shellcheck -s sh scripts/install.sh scripts/ci/installer-smoke.sh packaging/docker/entrypoint.sh

  # A real systemd host: install, run, upgrade, purge. Nodes started in CI
  # never dial the default seeds: they would join the real network.
  # The host runner persists, so clear what a failed run left behind.
  systemd:
    runs-on: host
    steps:
      - uses: https://github.com/actions/checkout@v7
      - name: Clean up earlier runs
        run: |
          docker rm -f keepword-ci 2>/dev/null || true
          if command -v keepword; then sudo sh scripts/install.sh --uninstall --purge --yes; fi
      - name: Install
        run: sudo sh scripts/install.sh --source . --yes --asn 64500 --country DE --peer https://peer.example.invalid --no-seeds
      - name: Service is up
        run: |
          test "$(sudo keepword config get network.seeds)" = false
          systemctl is-active keepword
          curl -fsS http://127.0.0.1:8481/v1/descriptor
          sudo keepword net status               # no alias: it becomes the keepword user
          sudo keepword watch add https://example.org/ --every 6h
          test "$(sudo stat -c %U /var/lib/keepword/index.sqlite)" = keepword
          sudo test -s /var/lib/keepword/ip2asn-combined.tsv   # data dir is 0750
          systemctl is-enabled keepword-asn-update.timer
          systemd-analyze security keepword.service --no-pager | tail -n 1
      - name: Upgrade keeps the key
        run: |
          key() { sudo keepword id | awk '/witness key/ {print $3}'; }
          before=$(key)
          sudo sh scripts/install.sh --source . --yes --retain normalized
          test "$before" = "$(key)"
          test "$(sudo keepword config get network.seeds)" = false
          systemctl is-active keepword
      - name: Uninstall
        run: |
          sudo sh scripts/install.sh --uninstall --purge --yes
          if id keepword; then echo "user not removed"; exit 1; fi
          test ! -e /var/lib/keepword

  # Fresh containers: package installation, rustup, build, service files.
  # The job runs inside the distro image, which has no Node for
  # actions/checkout, so it fetches the source with git.
  distros:
    runs-on: docker
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: sh
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:bookworm
            prep: apt-get update -qq && apt-get install -y -qq systemd curl git ca-certificates >/dev/null
            init: systemd
          - image: fedora:41
            prep: dnf install -y -q systemd procps-ng git
            init: systemd
          - image: archlinux:latest
            prep: pacman -Syu --noconfirm --needed systemd procps-ng git >/dev/null
            init: systemd
          - image: alpine:3.20
            prep: apk add --no-cache -q openrc curl procps git
            init: openrc
          # The latest release's binary, with the installer piped to sh.
          - image: debian:bookworm
            prep: apt-get update -qq && apt-get install -y -qq systemd curl git ca-certificates >/dev/null
            init: systemd
            mode: binary
          - image: alpine:3.20
            prep: apk add --no-cache -q openrc curl procps git
            init: openrc
            mode: binary
    steps:
      - name: Prepare ${{ matrix.image }}
        run: ${{ matrix.prep }}
      - name: Fetch the source
        run: |
          git init -q /src
          git -C /src fetch -q --depth 1 "${{ github.server_url }}/${{ github.repository }}.git" "${{ github.ref }}"
          git -C /src checkout -q FETCH_HEAD
      - name: Installer smoke test
        run: sh /src/scripts/ci/installer-smoke.sh ${{ matrix.init }} ${{ matrix.mode }}

  docker:
    runs-on: host
    steps:
      - uses: https://github.com/actions/checkout@v7
      - run: docker build -t keepword .
      - name: Container starts and configures itself
        run: |
          docker run -d --name keepword-ci -p 127.0.0.1:8481:8481 \
            -e KEEPWORD_ASN=64500 -e KEEPWORD_COUNTRY=DE \
            -e KEEPWORD_ENDPOINT=https://witness.example.invalid \
            -e KEEPWORD_PEERS=https://a.example.invalid,https://b.example.invalid \
            -e KEEPWORD_SEEDS=0 \
            keepword
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8481/v1/descriptor && break; sleep 2; done
          curl -fsS http://127.0.0.1:8481/v1/descriptor | grep -q witness.example.invalid
          test "$(docker exec keepword-ci keepword config get network.peers)" = '["https://a.example.invalid","https://b.example.invalid"]'
          test "$(docker exec keepword-ci keepword config get network.seeds)" = false
          docker exec keepword-ci keepword id
      - if: failure()
        run: docker logs keepword-ci
      - if: always()
        run: docker rm -f keepword-ci
