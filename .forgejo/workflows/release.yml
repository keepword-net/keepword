name: Release

# Push a tag like v1.0.0 to build static Linux binaries and Debian packages
# of them, publish a Forgejo release with them, their checksums and the
# changelog entry, put the packages in this Forgejo's apt repository, then
# publish the crates to crates.io. A pre-release tag, like v2.5.0-rc.1,
# publishes a Forgejo pre-release from the changelog's Unreleased section,
# its own image tag and its packages in the apt repository's beta suite
# only: the installer, the stable suite, the 2 and latest images and
# crates.io stay on the latest release. Run by hand, it only builds: to try
# a change to the runner image without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: rust
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7
      - uses: https://github.com/Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo pkgid -p keepword | sed 's/.*[#@]//')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: Install the target, zig and cargo-zigbuild
        run: |
          rustup target add ${{ matrix.target }}
          command -v zig >/dev/null && command -v cargo-zigbuild >/dev/null && exit 0
          python3 -m venv /tmp/zig || { apt-get update -qq && apt-get install -y -qq python3-venv >/dev/null && python3 -m venv /tmp/zig; }
          /tmp/zig/bin/pip install ziglang cargo-zigbuild
          echo /tmp/zig/bin >> "$GITHUB_PATH"
      - name: Build
        run: cargo zigbuild --release --locked -p keepword --target ${{ matrix.target }}
      - name: Package
        run: |
          name=keepword-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/keepword "dist/$name/"
          cp LICENSE README.md CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - name: Debian package
        run: |
          version=$(cargo pkgid -p keepword | sed 's/.*[#@]//')
          case ${{ matrix.target }} in x86_64-*) arch=amd64 ;; aarch64-*) arch=arm64 ;; esac
          sh packaging/debian/build-deb.sh target/${{ matrix.target }}/release/keepword "$version" "$arch" dist
      - uses: forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: debian
    steps:
      - uses: actions/checkout@v7
      - run: command -v jq >/dev/null && command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl jq >/dev/null; }
      - uses: forgejo/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz *.deb > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from the changelog
        run: |
          version=${GITHUB_REF_NAME#v}
          # A pre-release has the changes not released yet.
          case $version in *-*) section=Unreleased ;; *) section=$version ;; esac
          awk -v v="$section" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          cat >> notes.md <<'EOF'

          ### Install

          On a server, the installer sets up the service with the binary below:

          ```sh
          curl -fsSL https://git.keepword.net/keepword/keepword/raw/branch/main/scripts/install.sh \
              | sudo sh -s -- --binary --domain witness.example.org --caddy
          ```

          Drop `--binary` to build from source. The binaries below are static
          Linux builds of the `keepword` command (without headless rendering),
          and the `.deb` packages hold them with the node's services. On
          Debian and Ubuntu the installer installs the package from Keepword's
          apt repository, so `apt upgrade` keeps the node current. Check them
          against `SHA256SUMS`.
          EOF
          printf '\nThe container image holds the same binary, for both: `%s`.\n' \
            "${GITHUB_SERVER_URL#*://}/$GITHUB_REPOSITORY:$version" >> notes.md
          case $version in *-*)
            note='**A pre-release, to test before %s.** The installer and the `2` and `latest` images stay on the latest release: install this one with `--ref %s`.\n\n'
            { printf "$note" "${version%%-*}" "$GITHUB_REF_NAME"; cat notes.md; } > notes.tmp
            mv notes.tmp notes.md
          esac
      - name: Publish
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          case $GITHUB_REF_NAME in *-*) pre=true ;; *) pre=false ;; esac
          id=$(jq -n --arg tag "$GITHUB_REF_NAME" --rawfile body notes.md --argjson pre "$pre" \
                '{tag_name: $tag, name: "Keepword \($tag)", body: $body, prerelease: $pre}' |
            curl -fsS -X POST -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/json" --data @- "$API/releases" |
            jq -r .id)
          for f in dist/*.tar.gz dist/*.deb dist/SHA256SUMS; do
            curl -fsS -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$f" "$API/releases/$id/assets?name=$(basename "$f")" >/dev/null
          done
      # Into this Forgejo's apt repository, which the installer installs
      # from on Debian and Ubuntu. The stable suite gets releases; beta gets
      # them and pre-releases, so a node testing one moves on to the release
      # after it. With the image's REGISTRY_USER and REGISTRY_TOKEN, as the
      # repository is a package registry too.
      - name: Publish the Debian packages
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          : "${REGISTRY_USER:?set the REGISTRY_USER secret}" "${REGISTRY_TOKEN:?set the REGISTRY_TOKEN secret}"
          case $GITHUB_REF_NAME in *-*) suites=beta ;; *) suites="stable beta" ;; esac
          for suite in $suites; do
            for f in dist/*.deb; do
              curl -fsS --user "$REGISTRY_USER:$REGISTRY_TOKEN" --upload-file "$f" \
                "$GITHUB_SERVER_URL/api/packages/${GITHUB_REPOSITORY%%/*}/debian/pool/$suite/main/upload"
            done
          done

  # The container image for both targets, around the binaries above. On a
  # tag, pushed to this Forgejo's registry as 2.4.0, 2.4, 2 and latest (a
  # pre-release only as itself, 2.5.0-rc.1);
  # needs the REGISTRY_USER and REGISTRY_TOKEN secrets, a user and a token
  # of theirs with write:package scope. Run by hand, only built. QEMU runs
  # the image's apt step for arm64; the host runner persists, so clear
  # what a failed run left behind.
  image:
    needs: build
    runs-on: host
    steps:
      - uses: actions/checkout@v7
      - uses: forgejo/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Unpack the binaries
        run: |
          for t in amd64:x86_64 arm64:aarch64; do
            arch=${t%%:*}
            name=keepword-${GITHUB_REF_NAME}-${t#*:}-unknown-linux-musl
            mkdir -p "dist/$arch"
            tar -xzf "dist/$name.tar.gz" -C "dist/$arch" --strip-components=1 "$name/keepword"
          done
      - name: Build, and push on a tag
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          registry=${GITHUB_SERVER_URL#*://}
          image=$registry/$GITHUB_REPOSITORY
          trap 'docker buildx rm keepword-release 2>/dev/null; docker logout "$registry" >/dev/null' EXIT
          set -- --pull --provenance=false --platform linux/amd64,linux/arm64 \
            --build-arg BINARY=release \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
          case $GITHUB_REF in refs/tags/*)
            : "${REGISTRY_USER:?set the REGISTRY_USER secret}" "${REGISTRY_TOKEN:?set the REGISTRY_TOKEN secret}"
            version=${GITHUB_REF_NAME#v}
            set -- "$@" --push --label "org.opencontainers.image.version=$version" -t "$image:$version"
            case $version in *-*) ;; *)
              set -- "$@" -t "$image:${version%.*}" -t "$image:${version%%.*}" -t "$image:latest"
            esac
            printf '%s\n' "$REGISTRY_TOKEN" | docker login "$registry" -u "$REGISTRY_USER" --password-stdin
          esac
          [ -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ] ||
            docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3 --install arm64
          docker buildx rm keepword-release 2>/dev/null || true
          docker buildx create --name keepword-release --driver docker-container >/dev/null
          docker buildx build --builder keepword-release "$@" .

  # Last, as it can't be undone, and not for a pre-release: crates.io keeps
  # every version. All crates in dependency order; needs the
  # CARGO_REGISTRY_TOKEN secret, a crates.io token with publish-update scope.
  crates:
    needs: [release, image]
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: rust
    steps:
      - uses: actions/checkout@v7
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
