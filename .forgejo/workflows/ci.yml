name: CI

# Only for changes to the Rust code (config.rs includes the example config),
# and once per change: on pull requests and main, not every branch push.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/keepword.example.toml"
      - ".forgejo/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/keepword.example.toml"
      - ".forgejo/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: rust
    steps:
      - uses: https://github.com/actions/checkout@v7
      - uses: https://github.com/Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace
      - run: cargo build --workspace --features keepword/render

  # The TLSNotary tier is its own workspace (large git dependencies, Rust
  # 1.95+). Release mode: MPC-TLS is slow unoptimized.
  tlsn:
    runs-on: rust
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/keepword-tlsn
    steps:
      - uses: https://github.com/actions/checkout@v7
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          workspaces: crates/keepword-tlsn
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets
      - run: cargo test --release
