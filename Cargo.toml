[workspace]
resolver = "3"
members = [
    "crates/keepword-core",
    "crates/keepword-normalize",
    "crates/keepword-capture",
    "crates/keepword-store",
    "crates/keepword",
]
# Its own workspace; see crates/keepword-tlsn/Cargo.toml.
exclude = ["crates/keepword-tlsn"]

[workspace.package]
version = "2.4.0-dev"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
repository = "https://git.keepword.net/keepword/keepword"

[workspace.dependencies]
# Published together at one version: bump these pins with it.
keepword-core = { path = "crates/keepword-core", version = "=2.4.0-dev" }
keepword-normalize = { path = "crates/keepword-normalize", version = "=2.4.0-dev" }
keepword-capture = { path = "crates/keepword-capture", version = "=2.4.0-dev" }
keepword-store = { path = "crates/keepword-store", version = "=2.4.0-dev" }

anyhow = "1"
axum = "0.8"
base64 = "0.23"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "3"
encoding_rs = "0.8"
getrandom = "0.4"
hex = "0.4"
humantime = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
rusqlite = { version = "0.40", features = ["bundled"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "3"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
toml = "1"
unicode-normalization = "0.1"
url = { version = "2", features = ["serde"] }
