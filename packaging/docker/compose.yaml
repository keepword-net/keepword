# docker compose -f packaging/docker/compose.yaml up -d
#
# Pulls the release image; with --build, builds this checkout instead.
services:
  keepword:
    build:
      context: ../..
    image: git.keepword.net/keepword/keepword:2
    restart: unless-stopped
    volumes:
      - keepword-data:/data
    ports:
      - "127.0.0.1:8480:8480"   # web UI: local only
      - "127.0.0.1:8481:8481"   # peer API: put a TLS proxy in front
    environment:
      KEEPWORD_ASN: ""            # e.g. 3320
      KEEPWORD_COUNTRY: ""        # e.g. DE
      KEEPWORD_ENDPOINT: ""       # e.g. https://witness.example.org
      KEEPWORD_RELAY: ""          # at home, instead: auto
      KEEPWORD_PEERS: ""          # e.g. https://a.example,https://b.example
      KEEPWORD_BEHIND_PROXY: "1"
      KEEPWORD_UI_PASSWORD: ""    # web UI password; else the first visit sets one

volumes:
  keepword-data:
