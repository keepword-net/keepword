# Keepword node configuration. `keepword init` writes a minimal version of this
# to <data dir>/keepword.toml.

[vantage]
# Where this node fetches from. Self-reported; peers corroborate it from the
# addresses they see (docs/DESIGN.md §6.3).
asn = 3320
country = "DE"

[capture]
# Defaults to an honest "Keepword/<version>" user agent.
# user_agent = "Mozilla/5.0 ..."
timeout_secs = 30
max_body_mib = 32
# A proxy changes the vantage point and hides the server's TLS certificate.
use_system_proxy = false
# Refuse loopback / private / link-local targets. Only enable for LAN monitoring.
allow_private_addresses = false
# chrome = "/usr/bin/chromium"   # for `capture --render`

[content]
# full        headers + raw body + normalized text (evidence and diffs)
# normalized  headers + normalized text (diffs, no raw copy; the default)
# none        hashes only (edits detected, not shown)
retain = "normalized"

[network]
# Public base URL of this node's /v1 API: https://NAME, or http://IP:PORT
# without a domain. Unset, and with no relay, the node only pushes and is
# never assigned requests.
endpoint = "https://witness.example.org"
# Instead of an endpoint, at home behind NAT: a witness that relays for this
# one, or "auto" for one of its peers.
# relay = "auto"
relay_witnesses = 8        # relay for up to this many others; 0 = none
peers = ["https://witness.other-example.net"]
seeds = true               # also join through the built-in seed witnesses
sync_interval_secs = 60
replication = 5            # witnesses assigned per watch request
max_per_country = 2
max_requests_per_requester = 50
max_peers = 2000
gossip_fanout = 16         # random peers exchanged gossip with each round
audit_logs = 16            # auditors per log; same on every witness
checkpoint_interval_secs = 3600  # this log's checkpoint for auditors
cosign_interval_secs = 3600      # how often to audit each log
# Serve raw captured content to others only for these hosts.
serve_content_hosts = ["tagesschau.de", "bund.de"]
trust_forwarded_for = false  # true only behind your own reverse proxy
# client_ip_header = "X-Real-IP"  # behind a CDN: where that proxy puts the client
# Never capture these hosts for network requests (still relayed).
decline_hosts = ["intranet.example"]
max_request_watches = 200  # most URLs captured for the network at once
render_requests = false    # render requests in Chromium; see docs/DESIGN.md §6.4
allow_private_peers = false  # true only for a closed network on a LAN
# Requests a minute the public API answers from one address, in bursts of
# as many; 0 = no limit. Behind a proxy it needs trust_forwarded_for.
api_requests_per_minute = 600

[beacon]
drand_url = "https://api.drand.sh"   # "" to disable
allow_insecure_seed = false          # true only for private test networks

[quorum]
window_secs = 600
min_asns = 3
min_dissent_asns = 2
asn_db = "/var/lib/keepword/ip2asn-combined.tsv"   # from iptoasn.com
min_observers = 2
trust_self_reported = false          # true only for test networks
# When assigned witnesses disagree, witnesses drawn at random from the same
# countries capture the URL again, and only versions they reproduce count
# (docs/DESIGN.md §6.5).
recheck_size = 5                     # drawn per country; same on every witness
recheck_quorum = 3                   # networks that must reproduce a version
recheck_secs = 1800                  # how long after a disputed round rechecks run
max_rechecks_per_hour = 30           # most recheck captures this node makes
split_confirmations = 3              # a split alert needs this many confirmed splits
split_rounds = 4                     # among this many most recent settled rounds
max_failed_claims = 5                # a network prefix whose claims fail this often a week is left out

[anchor]
calendars = [
  "https://a.pool.opentimestamps.org",
  "https://b.pool.opentimestamps.org",
  "https://a.pool.eternitywall.com",
]
esplora_url = "https://blockstream.info/api"   # "" to disable
interval_secs = 3600

# Send alerts to your phone or a chat channel; see docs/USAGE.md.
[notify]
from = "this-node"   # or "network": also the alerts other witnesses raised
kinds = ["silent_edit", "split", "equivocation"]
# ui_url = "https://keepword.example.org"   # link alerts to this web UI
# Whoever has a target's URL can post there, or read an ntfy topic.
# Keepword writes this file readable by its owner only.
[[notify.targets]]
kind = "ntfy"        # ntfy, discord, slack or webhook
url = "https://ntfy.example.org/pick-a-long-random-topic"
# token = "tk_..."   # for an ntfy server with access control

# Per-site normalization rules. They apply to the host and its subdomains,
# and are committed to in every attestation's normalizer profile.
[[rules]]
host = "example-news.de"
remove = [".live-ticker", "#comments", ".reading-time"]
root = "article.story"
